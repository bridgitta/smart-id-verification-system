<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add ID Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f3f6;
            color: #333;
        }
        .navbar {
            background-color: #0a1f44;
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background-color: #1e90ff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #1c86ee;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">Admin Dashboard</a>
        <div>
            <a href="{{ url_for('dashboard') }}" class="nav-link d-inline">Dashboard</a>
            <a href="{{ url_for('logout') }}" class="nav-link d-inline">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card p-4">
        <h3 class="mb-4">Add New ID Record</h3>
        <form method="POST" action="{{ url_for('add_record') }}">
            <div class="mb-3">
                <label class="form-label">ID Number</label>
                <input type="text" name="id_number" class="form-control" required pattern="\d{3,}" title="Enter at least 3 digits" placeholder="E.g. 123456">
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required minlength="3" pattern="[A-Za-z\s]{3,}" title="At least 3 letters" placeholder="Enter full name">
            </div>
            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="dob" class="form-control" required min="{{ min_date }}" max="{{ max_date }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Father's Name</label>
                <input type="text" name="father" class="form-control" required minlength="3" pattern="[A-Za-z\s]{3,}" title="At least 3 letters" placeholder="Enter father's name">
            </div>
            <div class="mb-3">
                <label class="form-label">Mother's Name</label>
                <input type="text" name="mother" class="form-control" required minlength="3" pattern="[A-Za-z\s]{3,}" title="At least 3 letters" placeholder="Enter mother's name">
            </div>
            <div class="mb-3">
                <label class="form-label">Place of Birth</label>
                <input type="text" name="place" class="form-control" required minlength="3" pattern="[A-Za-z\s]{3,}" title="At least 3 letters" placeholder="Enter place of birth">
            </div>
            <button type="submit" class="btn btn-primary">Add Record</button>
        </form>
    </div>
</div>

</body>
</html>

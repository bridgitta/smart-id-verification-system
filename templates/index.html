<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart ID Verification System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
        }

        .header {
            background-color: #002147; /* Deep Blue */
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .form-section {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 3rem auto 1rem;
        }

        .btn-custom {
            background-color: #00bfff; /* Sky Blue */
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #009acd;
        }

        .footer {
            background-color: #2c2c2c; /* Charcoal */
            color: white;
            padding: 1rem;
            text-align: center;
            margin-top: 3rem;
        }

        .alert {
            max-width: 500px;
            margin: 1rem auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smart ID Verification System</h1>
        <p>Secure. Reliable. Fast.</p>
    </div>

    <!-- Flash Message Block -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="form-section">
        <form action="{{ url_for('verify') }}" method="POST">
            <div class="mb-3">
                <label for="id_number" class="form-label">Enter ID Number</label>
                <input type="text" class="form-control" id="id_number" name="id_number" placeholder="e.g., 123456789" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Verify ID</button>
        </form>
    </div>

    <div class="text-center my-4">
        <a href="{{ url_for('admin_login') }}" class="btn btn-outline-dark">Admin Login</a>
    </div>

    <div class="footer">
        &copy; 2025 Smart ID System | Designed with care
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

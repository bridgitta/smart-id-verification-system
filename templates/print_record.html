<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print ID Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        .header {
            text-align: center;
            color: #002147;
            margin-bottom: 30px;
        }
        .record-details p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .btn-print {
            background-color: #00bfff;
            border: none;
            color: white;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .btn-print:hover {
            background-color: #009acd;
        }
        @media print {
            .btn-print {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>ID Record Details</h2>
        <p>Smart ID Verification System</p>
    </div>

    <div class="record-details">
        <p><strong>ID Number:</strong> {{ record.id_number }}</p>
        <p><strong>Full Name:</strong> {{ record.name }}</p>
        <p><strong>Mother's Name:</strong> {{ record.mother }}</p>
        <p><strong>Father's Name:</strong> {{ record.father}}</p>
        <p><strong>Place of Birth:</strong> {{ record.place }}</p>
        <p><strong>Submission Date:</strong> {{ record.date_added }}</p>
    </div>

    <div class="text-center mt-4">
        <button onclick="window.print()" class="btn btn-print">Print Record</button>
    </div>
</div>
</body>
</html>
